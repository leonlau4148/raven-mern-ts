services:
  - type: web
    name: raven-mern-ts
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # The API this frontend talks to. Change it here if the backend moves.
      - key: VITE_API_URL
        value: https://raven-mern.onrender.com/api
    routes:
      # SPA fallback: BrowserRouter owns the URL, so a hard refresh on
      # /login must still serve index.html rather than 404.
      - type: rewrite
        source: /*
        destination: /index.html
