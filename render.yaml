services:
  - type: web
    name: raven-mern-ts
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Set these in the Render dashboard — never commit their values.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Restricts the API to the GitHub Pages site.
      - key: CORS_ORIGINS
        value: https://leonlau4148.github.io
